<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Candidaturas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Candidaturas">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --surface: #f4f7fc;
    --accent: #1d4ed8;
    --accent-soft: #e8f0ff;
    --text: #0f172a;
    --muted: #5b6472;
    --border: #10182a;
    --amber: #b45309;
    --amber-soft: #fef3e2;
    --red: #b91c1c;
    --red-soft: #fdecec;
    --green: #15803d;
    --green-soft: #e7f7ed;
    --slate: #475569;
    --slate-soft: #eef1f5;
  }
  html { background: #ffffff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header { margin-bottom: 18px; }
  .header-top-row { position: relative; height: 42px; margin-bottom: 6px; }
  h1 {
    font-size: 1.35rem;
    margin: 0;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  h1 .accent-word { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .back-btn {
    position: absolute; left: 0; top: 0;
    background: var(--card); border: 1.5px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600;
  }
  .sync-btn {
    position: absolute; right: 0; top: 0;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--card); border: 1.5px solid var(--border);
    color: var(--text); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .sync-btn.syncing { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ---- Home menu ---- */
  .home-btn {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 18px;
    padding: 22px 20px; margin-bottom: 14px; text-align: left; width: 100%;
  }
  .home-btn-icon {
    width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0;
  }
  .home-btn-title { font-size: 1.08rem; font-weight: 800; color: var(--text); }
  .home-btn-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  /* ---- Stats chips ---- */
  .stats-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .stat-chip {
    flex: 0 0 auto; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 68px;
  }
  .stat-chip .num { font-size: 1.15rem; font-weight: 800; }
  .stat-chip .lbl { font-size: 0.65rem; color: var(--muted); margin-top: 1px; }

  /* ---- Tabs (Lista / Seguimientos) ---- */
  .tab-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--card); color: var(--muted);
    font-size: 0.85rem; font-weight: 700; position: relative;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-badge {
    display: inline-block; background: var(--red); color: #fff; font-size: 0.65rem; font-weight: 800;
    border-radius: 10px; padding: 1px 6px; margin-left: 5px;
  }

  /* ---- Filter chips ---- */
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .filter-chip {
    flex: 0 0 auto; background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 20px; padding: 7px 14px; font-size: 0.78rem; font-weight: 600;
  }
  .filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* ---- Application cards ---- */
  .app-card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; position: relative;
  }
  .app-card.warn { border-color: var(--amber); background: var(--amber-soft); }
  .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .app-company { font-weight: 700; font-size: 1rem; }
  .app-role { color: var(--muted); font-size: 0.82rem; margin-top: 1px; }
  .status-badge {
    font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0; border: 1px solid currentColor;
  }
  .app-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 6px; }
  .app-days { font-size: 0.72rem; color: var(--muted); }
  .app-days.warn { color: var(--amber); font-weight: 700; }
  .modality-tag { font-size: 0.7rem; color: var(--accent); font-weight: 600; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem; }

  /* ---- Follow-up cards ---- */
  .followup-card {
    background: var(--amber-soft); border: 1.5px solid var(--amber); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .followup-days { font-size: 0.78rem; color: var(--amber); font-weight: 700; margin-top: 2px; }
  .followup-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .followup-actions button {
    flex: 1; min-width: 100px; padding: 9px 8px; border-radius: 10px; font-size: 0.76rem; font-weight: 700;
    border: 1.5px solid var(--border); background: #fff; color: var(--text);
  }
  .followup-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .followup-actions button.danger { background: var(--red-soft); color: var(--red); border-color: var(--red); }

  /* ---- FAB ---- */
  .fab {
    position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 1.8rem; font-weight: 700;
    border: 1.5px solid var(--border); box-shadow: 0 8px 20px rgba(29,78,216,0.28);
    display: flex; align-items: center; justify-content: center; line-height: 0;
  }

  /* ---- Form view ---- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--surface); border: 1.5px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 0.9rem;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt-chip {
    flex: 1; min-width: 72px; text-align: center; padding: 10px 6px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--surface); font-size: 0.78rem; color: var(--muted); font-weight: 600;
  }
  .opt-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .primary-btn {
    width: 100%; background: var(--accent); color: #fff; border: 1.5px solid var(--border); font-weight: 800;
    padding: 13px; border-radius: 12px; font-size: 0.95rem; margin-top: 6px;
  }
  .secondary-btn {
    width: 100%; background: #fff; color: var(--text); border: 1.5px solid var(--border);
    padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 10px; font-weight: 600;
  }
  .danger-btn {
    width: 100%; background: var(--red-soft); color: var(--red); border: 1.5px solid var(--red);
    padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 10px; font-weight: 700;
  }

  /* ---- Stats view ---- */
  .stats-controls { margin-bottom: 18px; }
  .stats-control-label { font-size: 0.75rem; color: var(--muted); font-weight: 700; margin: 14px 0 6px 0; }
  .chart-wrap {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 10px;
  }

  /* ---- Toast ---- */
  #toast {
    position: fixed; left: 50%; top: -80px; transform: translateX(-50%);
    background: #fff; border: 1.5px solid var(--accent);
    color: var(--accent); font-weight: 700; font-size: 0.9rem; padding: 12px 22px;
    border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 999;
    transition: top 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease; opacity: 0; pointer-events: none;
  }
  #toast.show { top: 16px; opacity: 1; }

  .info-box {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 16px; font-size: 0.85rem; color: var(--muted); line-height: 1.5;
  }

  /* ---- Lock screen ---- */
  .lock-screen { max-width: 300px; margin: 70px auto 0; text-align: center; }
  .lock-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
  .lock-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 22px; }
  .lock-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 30px; }
  .lock-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.15s; }
  .lock-dot.filled { background: var(--accent); border-color: var(--accent); }
  .lock-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 250px; margin: 0 auto; }
  .lock-key {
    padding: 16px 0; border-radius: 14px; border: 1.5px solid var(--border);
    background: #fff; font-size: 1.25rem; font-weight: 700; color: var(--text);
  }
  .lock-key.empty { visibility: hidden; border: none; }
  .lock-key.del { font-size: 1rem; }
  .lock-error { color: var(--red); font-size: 0.82rem; margin-top: 14px; height: 18px; font-weight: 600; }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }
  .sync-code-box {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; text-align: center;
  }
  .sync-code-display {
    font-family: monospace; font-size: 0.95rem; color: var(--accent);
    background: var(--accent-soft); border: 1px dashed var(--accent);
    border-radius: 10px; padding: 10px; margin: 10px 0; word-break: break-all;
  }
  .sync-status { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

<div id="toast">✅ <span id="toastText">Guardado</span></div>

<header id="mainHeader">
  <div class="header-top-row">
    <button class="back-btn" id="backBtn" style="display:none;">‹ Volver</button>
    <button class="sync-btn" id="syncBtn"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.1-6.8"/><polyline points="21 3 21 9 15 9"/></svg></button>
  </div>
  <h1 id="pageTitle">Candidaturas</h1>
  <div class="subtitle" id="subtitleLabel"></div>
</header>

<div id="app"></div>

<button class="fab" id="fabBtn" style="display:none;">+</button>

<script>
/* =========================================================
   SINCRONIZACIÓN EN LA NUBE (Supabase) — OPCIONAL
   ========================================================= */
const SUPABASE_URL = "https://rqnscdzrcxhozxhxbifs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__KziCu_0TuysYp5iJG7FgQ_K5HfRvXb";

const SYNC_CODE_KEY = "candidaturas:synccode";
const PIN_KEY = "candidaturas:pinhash";

async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function hasPin() { return !!localStorage.getItem(PIN_KEY); }
async function setPin(pin) { localStorage.setItem(PIN_KEY, await sha256(pin)); }
function removePin() { localStorage.removeItem(PIN_KEY); }
async function checkPin(pin) { return (await sha256(pin)) === localStorage.getItem(PIN_KEY); }
let supabaseClient = null;
try {
  if (window.supabase && SUPABASE_URL.startsWith("http")) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { console.error("Supabase no configurado todavía", e); }

function getSyncCode() { return localStorage.getItem(SYNC_CODE_KEY) || ""; }
function setSyncCode(code) { localStorage.setItem(SYNC_CODE_KEY, code); }
function genSyncCode() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "sync-" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
}

function mergeApps(local, cloud) {
  const map = {};
  local.forEach(x => { map[x.id] = x; });
  cloud.forEach(x => {
    const existing = map[x.id];
    const xTime = x.lastUpdate || x.dateApplied || "";
    const eTime = existing ? (existing.lastUpdate || existing.dateApplied || "") : "";
    if (!existing || xTime > eTime) map[x.id] = x;
  });
  return Object.values(map);
}

async function syncNow(showMsg) {
  const code = getSyncCode();
  if (!code || !supabaseClient) return;
  const btn = document.getElementById('syncBtn');
  if (btn) btn.classList.add('syncing');
  try {
    const { data, error } = await supabaseClient.rpc('get_synced_data', { p_code: code });
    if (error) throw error;
    const cloudApps = Array.isArray(data) ? data : [];
    const localApps = loadApps();
    const merged = mergeApps(localApps, cloudApps);
    saveApps(merged);
    const { error: pushError } = await supabaseClient.rpc('set_synced_data', { p_code: code, p_data: merged });
    if (pushError) throw pushError;
    localStorage.setItem("candidaturas:lastsync", new Date().toISOString());
    if (showMsg) showToast("🔄 Sincronizado correctamente");
    if (currentView === "candidaturas" || currentView === "home") render();
  } catch (e) {
    console.error("Error de sincronización:", e);
    if (showMsg) showToast("⚠️ No se pudo sincronizar (revisa tu conexión o configuración)");
  } finally {
    if (btn) btn.classList.remove('syncing');
  }
}

/* =========================================================
   ESTADO PERSISTENTE
   ========================================================= */
const APPS_KEY = "candidaturas:list";
const FOLLOWUP_MILESTONES = [7, 14, 30];

const STATUSES = [
  { id: "enviado", label: "Enviado", color: "var(--slate)", soft: "var(--slate-soft)" },
  { id: "entrevista", label: "Entrevista", color: "var(--amber)", soft: "var(--amber-soft)" },
  { id: "descartado", label: "Descartado", color: "var(--red)", soft: "var(--red-soft)" },
  { id: "oferta", label: "Oferta", color: "var(--green)", soft: "var(--green-soft)" }
];
const LANGS = ["Español", "Inglés", "Otro"];
const MODALITIES = [
  { id: "presencial", label: "Presencial" },
  { id: "remoto", label: "Remoto" },
  { id: "hibrido", label: "Híbrido" }
];

function loadApps() {
  try {
    const raw = localStorage.getItem(APPS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("Datos corruptos, se reinician", e);
    return [];
  }
}
function saveApps(apps) { localStorage.setItem(APPS_KEY, JSON.stringify(apps)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d1 = new Date(dateStr + "T00:00:00");
  const d2 = new Date(todayStr() + "T00:00:00");
  return Math.round((d2 - d1) / 86400000);
}
function statusInfo(id) { return STATUSES.find(s => s.id === id) || STATUSES[0]; }
function modalityInfo(id) { return MODALITIES.find(m => m.id === id); }

function pendingMilestones(a) {
  if (a.status !== "enviado" && a.status !== "entrevista") return [];
  const d = daysSince(a.dateApplied);
  const dismissed = a.dismissedMilestones || [];
  return FOLLOWUP_MILESTONES.filter(m => d >= m && !dismissed.includes(m));
}
function dismissCurrentMilestones(a) {
  const d = daysSince(a.dateApplied);
  const dismissed = new Set(a.dismissedMilestones || []);
  FOLLOWUP_MILESTONES.forEach(m => { if (d >= m) dismissed.add(m); });
  a.dismissedMilestones = Array.from(dismissed);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  clearTimeout(toastTimer);
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
let currentView = "home"; // home | candidaturas | form | stats | sync
let candTab = "lista"; // lista | seguimientos
let editingId = null;
let activeFilter = "todas";
let formReturnView = "candidaturas";
let syncReturnView = "home";
let statsChartType = "bar"; // bar | line
let statsGroupBy = "estado"; // estado | mes | modalidad
let showGhosted = false;

document.getElementById('syncBtn').addEventListener('click', () => {
  syncReturnView = currentView;
  currentView = "sync";
  render();
});
document.getElementById('backBtn').addEventListener('click', () => {
  if (currentView === "form") { currentView = formReturnView; }
  else if (currentView === "sync") { currentView = syncReturnView; }
  else { currentView = "home"; }
  render();
});
document.getElementById('fabBtn').addEventListener('click', () => {
  editingId = null; formReturnView = "candidaturas"; currentView = "form"; render();
});

function render() {
  const backBtn = document.getElementById('backBtn');
  const title = document.getElementById('pageTitle');
  const subtitle = document.getElementById('subtitleLabel');
  const app = document.getElementById('app');
  const fab = document.getElementById('fabBtn');

  backBtn.style.display = currentView === "home" ? "none" : "block";
  fab.style.display = (currentView === "candidaturas" && candTab === "lista") ? "flex" : "none";

  if (currentView === "home") {
    title.innerHTML = `Panel de <span class="accent-word">empleo</span>`;
    subtitle.textContent = "Seguimiento de tu búsqueda de empleo";
    renderHome(app);
    return;
  }
  if (currentView === "candidaturas") {
    title.innerHTML = iconSpan('cv') + "Candidaturas";
    subtitle.textContent = "";
    renderCandidaturas(app);
    return;
  }
  if (currentView === "form") {
    title.textContent = editingId ? "Editar candidatura" : "Nueva candidatura";
    subtitle.textContent = "";
    renderForm(app);
    return;
  }
  if (currentView === "stats") {
    title.innerHTML = iconSpan('stats') + "Estadísticas";
    subtitle.textContent = "";
    renderStats(app);
    return;
  }
  if (currentView === "sync") {
    title.innerHTML = iconSpan('sync') + "Sincronización";
    subtitle.textContent = "";
    renderSync(app);
    return;
  }
}

/* =========================================================
   HOME
   ========================================================= */
function renderHome(app) {
  const apps = loadApps();
  const pendingCount = apps.filter(a => pendingMilestones(a).length > 0).length;
  app.innerHTML = `
    <button class="home-btn" id="goCandidaturas" style="cursor:pointer;">
      <div class="home-btn-icon" style="color:var(--accent);">${ICONS.cv}</div>
      <div>
        <div class="home-btn-title">Candidaturas</div>
        <div class="home-btn-sub">${apps.length} registrada${apps.length === 1 ? "" : "s"}${pendingCount ? ` · ${pendingCount} necesita${pendingCount === 1 ? "" : "n"} seguimiento` : ""}</div>
      </div>
    </button>
    <button class="home-btn" id="goStats" style="cursor:pointer;">
      <div class="home-btn-icon" style="color:var(--accent);">${ICONS.stats}</div>
      <div>
        <div class="home-btn-title">Estadísticas</div>
        <div class="home-btn-sub">Gráficas de tu búsqueda de empleo</div>
      </div>
    </button>
  `;
  document.getElementById('goCandidaturas').addEventListener('click', () => { currentView = "candidaturas"; candTab = "lista"; render(); });
  document.getElementById('goStats').addEventListener('click', () => { currentView = "stats"; render(); });
}

/* =========================================================
   CANDIDATURAS (lista + seguimientos)
   ========================================================= */
function renderCandidaturas(app) {
  const apps = loadApps();
  const needsFollowup = apps.filter(a => pendingMilestones(a).length > 0);

  let tabsHtml = `
    <div class="tab-row">
      <button class="tab-btn ${candTab === 'lista' ? 'active' : ''}" data-tab="lista">Lista</button>
      <button class="tab-btn ${candTab === 'seguimientos' ? 'active' : ''}" data-tab="seguimientos">Seguimientos${needsFollowup.length ? `<span class="tab-badge">${needsFollowup.length}</span>` : ''}</button>
    </div>
  `;

  app.innerHTML = tabsHtml + `<div id="candTabContent"></div>`;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { candTab = btn.dataset.tab; render(); });
  });

  const content = document.getElementById('candTabContent');
  if (candTab === "lista") renderList(content, apps);
  else renderFollowups(content, needsFollowup);
}

function renderList(app, apps) {
  const counts = { enviado: 0, entrevista: 0, descartado: 0, oferta: 0 };
  apps.forEach(a => { if (counts[a.status] !== undefined) counts[a.status]++; });

  let statsHtml = `<div class="stats-row">`;
  statsHtml += `<div class="stat-chip"><div class="num">${apps.length}</div><div class="lbl">Total</div></div>`;
  STATUSES.forEach(s => {
    statsHtml += `<div class="stat-chip"><div class="num" style="color:${s.color}">${counts[s.id]}</div><div class="lbl">${s.label}</div></div>`;
  });
  statsHtml += `</div>`;

  let filterHtml = `<div class="filter-row">`;
  const filters = [{ id: "todas", label: "Todas" }, ...STATUSES];
  filters.forEach(f => {
    filterHtml += `<button class="filter-chip ${activeFilter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>`;
  });
  filterHtml += `</div>`;

  const filtered = activeFilter === "todas" ? apps : apps.filter(a => a.status === activeFilter);
  const sorted = filtered.slice().sort((a, b) => (b.dateApplied || "").localeCompare(a.dateApplied || ""));

  let listHtml = "";
  if (sorted.length === 0) {
    listHtml = `<div class="empty-state">${apps.length === 0 ? "Aún no has añadido ninguna candidatura.<br>Toca el botón + para empezar." : "No hay candidaturas con este filtro."}</div>`;
  } else {
    sorted.forEach(a => {
      const s = statusInfo(a.status);
      const d = daysSince(a.dateApplied);
      const warn = pendingMilestones(a).length > 0;
      const mod = modalityInfo(a.modality);
      listHtml += `
        <div class="app-card ${warn ? 'warn' : ''}" data-id="${a.id}">
          <div class="app-card-top">
            <div>
              <div class="app-company">${escapeHtml(a.company)}</div>
              <div class="app-role">${escapeHtml(a.role || "")}</div>
            </div>
            <span class="status-badge" style="background:${s.soft}; color:${s.color}; border-color:${s.color};">${s.label}</span>
          </div>
          <div class="app-meta">
            <span class="app-days ${warn ? 'warn' : ''}">${warn ? "⏰ " : ""}Enviada hace ${d} día${d === 1 ? "" : "s"}</span>
            ${mod ? `<span class="modality-tag">${mod.label}</span>` : ""}
          </div>
        </div>
      `;
    });
  }

  app.innerHTML = statsHtml + filterHtml + listHtml;

  app.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => { activeFilter = btn.dataset.filter; render(); });
  });
  app.querySelectorAll('.app-card').forEach(card => {
    card.addEventListener('click', () => { editingId = card.dataset.id; formReturnView = "candidaturas"; currentView = "form"; render(); });
  });
}

function renderFollowups(app, needsFollowup) {
  if (needsFollowup.length === 0) {
    app.innerHTML = `<div class="empty-state">✅ Todo al día.<br>No hay candidaturas pendientes de seguimiento.</div>`;
    return;
  }
  const sorted = needsFollowup.slice().sort((a, b) => daysSince(b.dateApplied) - daysSince(a.dateApplied));
  let html = `<div class="info-box" style="margin-bottom:14px;">Estas candidaturas llevan un tiempo sin novedades. Marca si sigue igual, actualiza el estado, o elimínala si han pasado de ti.</div>`;
  sorted.forEach(a => {
    const d = daysSince(a.dateApplied);
    const milestone = Math.max(...pendingMilestones(a));
    html += `
      <div class="followup-card" data-id="${a.id}">
        <div class="app-company">${escapeHtml(a.company)}</div>
        <div class="app-role">${escapeHtml(a.role || "")}</div>
        <div class="followup-days">⏰ ${d} días sin novedades (aviso de ${milestone} días)</div>
        <div class="followup-actions">
          <button class="stay-btn">Sigue igual</button>
          <button class="primary update-btn">Actualizar estado</button>
          <button class="danger delete-btn">Eliminar</button>
        </div>
      </div>
    `;
  });
  app.innerHTML = html;

  app.querySelectorAll('.followup-card').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('.stay-btn').addEventListener('click', () => {
      const list = loadApps();
      const rec = list.find(x => x.id === id);
      if (rec) { dismissCurrentMilestones(rec); saveApps(list); showToast("👍 Anotado, seguimos esperando"); render(); syncNow(false); }
    });
    card.querySelector('.update-btn').addEventListener('click', () => {
      editingId = id; formReturnView = "candidaturas"; currentView = "form"; candTab = "seguimientos"; render();
    });
    card.querySelector('.delete-btn').addEventListener('click', () => {
      if (!confirm("¿Eliminar esta candidatura? No se puede deshacer.")) return;
      const list = loadApps().filter(x => x.id !== id);
      saveApps(list);
      showToast("🗑️ Candidatura eliminada");
      render();
      syncNow(false);
    });
  });
}

function computeGrouped(groupBy) {
  const apps = loadApps();
  if (groupBy === "estado") {
    return { labels: STATUSES.map(s => s.label), values: STATUSES.map(s => apps.filter(a => a.status === s.id).length) };
  }
  if (groupBy === "modalidad") {
    return { labels: MODALITIES.map(m => m.label), values: MODALITIES.map(m => apps.filter(a => a.modality === m.id).length) };
  }
  // mes
  const map = {};
  apps.forEach(a => {
    const ym = (a.dateApplied || "").slice(0, 7);
    if (!ym) return;
    map[ym] = (map[ym] || 0) + 1;
  });
  const keys = Object.keys(map).sort();
  const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
  const labels = keys.map(k => { const [y, m] = k.split("-"); return monthNames[parseInt(m, 10) - 1] + " '" + y.slice(2); });
  const values = keys.map(k => map[k]);
  return { labels, values };
}

function renderChartSVG(data, type) {
  const { labels, values } = data;
  if (labels.length === 0 || values.every(v => v === 0)) {
    return `<div class="empty-state">Aún no hay datos suficientes para graficar.</div>`;
  }
  const W = Math.max(labels.length * 68, 280);
  const H = 220;
  const padL = 26, padR = 16, padT = 20, padB = 40;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const maxVal = Math.max(...values, 1);
  const stepX = innerW / labels.length;

  let svgInner = `<line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" stroke="#10182a" stroke-width="1.5"/>`;

  if (type === "bar") {
    const barW = stepX * 0.5;
    values.forEach((v, i) => {
      const h = maxVal ? (v / maxVal) * innerH : 0;
      const x = padL + i * stepX + (stepX - barW) / 2;
      const y = padT + innerH - h;
      svgInner += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="#1d4ed8" stroke="#10182a" stroke-width="1"/>`;
      svgInner += `<text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">${v}</text>`;
    });
  } else {
    const points = values.map((v, i) => {
      const h = maxVal ? (v / maxVal) * innerH : 0;
      return [padL + i * stepX + stepX / 2, padT + innerH - h];
    });
    const pathD = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    svgInner += `<path d="${pathD}" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>`;
    points.forEach((p, i) => {
      svgInner += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#1d4ed8" stroke="#10182a" stroke-width="1.5"/>`;
      svgInner += `<text x="${p[0]}" y="${p[1] - 10}" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">${values[i]}</text>`;
    });
  }
  labels.forEach((lb, i) => {
    const x = padL + i * stepX + stepX / 2;
    svgInner += `<text x="${x}" y="${padT + innerH + 18}" text-anchor="middle" font-size="10.5" fill="#5b6472">${lb}</text>`;
  });

  return `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block; min-width:100%;">${svgInner}</svg></div>`;
}

}

function renderGhosted(wrap) {
  const GHOST_DAYS = 20;
  const apps = loadApps().filter(a => (a.status === "enviado" || a.status === "entrevista") && daysSince(a.dateApplied) >= GHOST_DAYS);
  const sorted = apps.slice().sort((a, b) => daysSince(b.dateApplied) - daysSince(a.dateApplied));

  if (sorted.length === 0) {
    wrap.innerHTML = `<div class="empty-state">Ninguna candidatura lleva ${GHOST_DAYS}+ días sin respuesta. 🎉</div>`;
    return;
  }

  let html = `<div class="info-box" style="margin-bottom:14px;">${sorted.length} candidatura${sorted.length === 1 ? '' : 's'} sin respuesta desde hace ${GHOST_DAYS} días o más.</div>`;
  sorted.forEach(a => {
    const s = statusInfo(a.status);
    const d = daysSince(a.dateApplied);
    html += `
      <div class="app-card warn" data-id="${a.id}">
        <div class="app-card-top">
          <div>
            <div class="app-company">${escapeHtml(a.company)}</div>
            <div class="app-role">${escapeHtml(a.role || "")}</div>
          </div>

        </div>
        <div class="app-meta">
          <span class="app-days warn">⏰ ${d} días sin respuesta</span>
        </div>
      </div>
    `;
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll('.app-card').forEach(card => {
    card.addEventListener('click', () => { editingId = card.dataset.id; formReturnView = "stats"; currentView = "form"; render(); });
  });
}

function renderLockScreen(errorMsg) {
  const app = document.getElementById('app');
  const dots = [0, 1, 2, 3].map(i => `<div class="lock-dot ${i < lockInput.length ? 'filled' : ''}"></div>`).join('');
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  app.innerHTML = `
    <div class="lock-screen">
      <div class="lock-title">🔒 Candidaturas bloqueada</div>
      <div class="lock-sub">Introduce tu PIN para continuar</div>
      <div class="lock-dots" id="lockDots">${dots}</div>
      <div class="lock-keypad" id="lockKeypad">
        ${keys.map(k => k === "" ? `<div class="lock-key empty"></div>` : `<button class="lock-key ${k === 'del' ? 'del' : ''}" data-key="${k}">${k === 'del' ? '⌫' : k}</button>`).join('')}
      </div>
      <div class="lock-error">${errorMsg || ""}</div>
    </div>
  `;
  document.querySelectorAll('.lock-key[data-key]').forEach(btn => {
    btn.addEventListener('click', () => onLockKey(btn.dataset.key));
  });
}
async function onLockKey(key) {
  if (key === "del") { lockInput = lockInput.slice(0, -1); renderLockScreen(); return; }
  if (lockInput.length >= 4) return;
  lockInput += key;
  renderLockScreen();
  if (lockInput.length === 4) {
    const ok = await checkPin(lockInput);
    if (ok) {
      sessionStorage.setItem('unlocked', '1');
      document.getElementById('mainHeader').style.display = "";
      startApp();
    } else {
      const dotsEl = document.getElementById('lockDots');
      if (dotsEl) dotsEl.classList.add('shake');
      renderLockScreen("PIN incorrecto, inténtalo de nuevo");
      setTimeout(() => { lockInput = ""; renderLockScreen(); }, 500);
    }
  }
}

function startApp() {
  try {
    render();
    syncNow(false);
  } catch (e) {
    console.error("Error al iniciar la app:", e);
    document.getElementById('app').innerHTML = `
      <div class="info-box">
        <p>⚠️ Hubo un problema al cargar tus datos guardados.</p>
        <p>Puedes intentar recargar, o si persiste, reiniciar solo los datos de la app (tus datos guardados en este dispositivo se borrarían).</p>
      </div>
      <button class="secondary-btn" onclick="location.reload()">Recargar</button>
      <button class="danger-btn" onclick="localStorage.clear(); location.reload();">Reiniciar datos de la app</button>
    `;
  }
}

/* Init */
if (hasPin() && sessionStorage.getItem('unlocked') !== '1') {
  showLockScreen();
} else {
  startApp();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
