<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seguimiento de candidaturas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Candidaturas">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0c0f0d;
    --card: #171b18;
    --accent: #4ade80;
    --text: #f2f5f2;
    --muted: #9aa89e;
    --border: #262c27;
    --amber: #fbbf24;
    --red: #f87171;
    --slate: #93a5b8;
  }
  html { background: #0c0f0d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header { margin-bottom: 16px; }
  .header-top-row { position: relative; height: 42px; margin-bottom: 6px; }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.2px;
    text-shadow: 0 0 18px rgba(74, 222, 128, 0.25);
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .back-btn {
    position: absolute; left: 0; top: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem;
  }

  /* ---- Stats chips ---- */
  .stats-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .stat-chip {
    flex: 0 0 auto; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 68px;
  }
  .stat-chip .num { font-size: 1.15rem; font-weight: 800; }
  .stat-chip .lbl { font-size: 0.65rem; color: var(--muted); margin-top: 1px; }

  /* ---- Follow-up banner ---- */
  .followup-banner {
    background: linear-gradient(135deg, #241c14, #1c1610);
    border: 1px solid var(--amber);
    color: var(--amber);
    border-radius: 14px; padding: 12px 14px; font-size: 0.82rem;
    margin-bottom: 14px; line-height: 1.4;
  }
  .followup-banner b { color: #ffd479; }

  /* ---- Filter chips ---- */
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .filter-chip {
    flex: 0 0 auto; background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 20px; padding: 7px 14px; font-size: 0.78rem;
  }
  .filter-chip.active { background: rgba(74,222,128,0.12); border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* ---- Application cards ---- */
  .app-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; position: relative;
  }
  .app-card.warn { border-color: var(--amber); }
  .app-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .app-company { font-weight: 700; font-size: 1rem; }
  .app-role { color: var(--muted); font-size: 0.82rem; margin-top: 1px; }
  .status-badge {
    font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .app-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .app-days { font-size: 0.72rem; color: var(--muted); }
  .app-days.warn { color: var(--amber); font-weight: 700; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem; }

  /* ---- FAB ---- */
  .fab {
    position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: #0c0f0d; font-size: 1.8rem; font-weight: 700;
    border: none; box-shadow: 0 8px 24px rgba(74,222,128,0.35);
    display: flex; align-items: center; justify-content: center; line-height: 0;
  }

  /* ---- Form view ---- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 0.9rem;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .status-select-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-opt {
    flex: 1; min-width: 72px; text-align: center; padding: 10px 6px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); font-size: 0.78rem; color: var(--muted);
  }
  .status-opt.selected { border-color: currentColor; font-weight: 700; }
  .primary-btn {
    width: 100%; background: var(--accent); color: #0c0f0d; border: none; font-weight: 800;
    padding: 13px; border-radius: 12px; font-size: 0.95rem; margin-top: 6px;
  }
  .secondary-btn {
    width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 10px;
  }
  .danger-btn {
    width: 100%; background: transparent; color: var(--red); border: 1px solid var(--red);
    padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 10px;
  }
  .link-row { font-size: 0.82rem; color: var(--accent); margin-top: 8px; word-break: break-all; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; left: 50%; top: -80px; transform: translateX(-50%);
    background: linear-gradient(135deg, #1c2a20, #14201a); border: 1px solid var(--accent);
    color: var(--accent); font-weight: 700; font-size: 0.9rem; padding: 12px 22px;
    border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 999;
    transition: top 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease; opacity: 0; pointer-events: none;
  }
  #toast.show { top: 16px; opacity: 1; }

  .info-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; font-size: 0.85rem; color: var(--muted); line-height: 1.5;
  }
</style>
</head>
<body>

<div id="toast">✅ <span id="toastText">Guardado</span></div>

<header>
  <div class="header-top-row">
    <button class="back-btn" id="backBtn" style="display:none;">‹ Volver</button>
  </div>
  <h1 id="pageTitle">💼 Candidaturas</h1>
  <div class="subtitle" id="subtitleLabel">Seguimiento de tu búsqueda de empleo</div>
</header>

<div id="app"></div>

<button class="fab" id="fabBtn">+</button>

<script>
/* =========================================================
   ESTADO PERSISTENTE
   ========================================================= */
const APPS_KEY = "candidaturas:list";
const FOLLOWUP_DAYS = 14;

const STATUSES = [
  { id: "enviado", label: "Enviado", color: "var(--slate)" },
  { id: "entrevista", label: "Entrevista", color: "var(--amber)" },
  { id: "descartado", label: "Descartado", color: "var(--red)" },
  { id: "oferta", label: "Oferta", color: "var(--accent)" }
];
const LANGS = ["Español", "Inglés", "Otro"];

function loadApps() {
  try {
    const raw = localStorage.getItem(APPS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("Datos corruptos, se reinician", e);
    return [];
  }
}
function saveApps(apps) { localStorage.setItem(APPS_KEY, JSON.stringify(apps)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function daysSince(dateStr) {
  const d1 = new Date(dateStr + "T00:00:00");
  const d2 = new Date(todayStr() + "T00:00:00");
  return Math.round((d2 - d1) / 86400000);
}
function statusInfo(id) { return STATUSES.find(s => s.id === id) || STATUSES[0]; }

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  clearTimeout(toastTimer);
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* =========================================================
   NAVEGACIÓN Y RENDER
   ========================================================= */
let currentView = "list"; // list | form
let editingId = null;
let activeFilter = "todas";

document.getElementById('backBtn').addEventListener('click', () => { currentView = "list"; editingId = null; render(); });
document.getElementById('fabBtn').addEventListener('click', () => { editingId = null; currentView = "form"; render(); });

function render() {
  const backBtn = document.getElementById('backBtn');
  const title = document.getElementById('pageTitle');
  const subtitle = document.getElementById('subtitleLabel');
  const app = document.getElementById('app');
  document.getElementById('fabBtn').style.display = currentView === "list" ? "flex" : "none";

  if (currentView === "form") {
    backBtn.style.display = "block";
    title.textContent = editingId ? "✏️ Editar candidatura" : "➕ Nueva candidatura";
    subtitle.textContent = "";
    renderForm(app);
    return;
  }

  backBtn.style.display = "none";
  title.textContent = "💼 Candidaturas";
  subtitle.textContent = "Seguimiento de tu búsqueda de empleo";
  renderList(app);
}

function renderList(app) {
  const apps = loadApps();

  const counts = { enviado: 0, entrevista: 0, descartado: 0, oferta: 0 };
  apps.forEach(a => { if (counts[a.status] !== undefined) counts[a.status]++; });

  const needsFollowup = apps.filter(a =>
    (a.status === "enviado" || a.status === "entrevista") && daysSince(a.lastUpdate || a.dateApplied) >= FOLLOWUP_DAYS
  );

  let statsHtml = `<div class="stats-row">`;
  statsHtml += `<div class="stat-chip"><div class="num">${apps.length}</div><div class="lbl">Total</div></div>`;
  STATUSES.forEach(s => {
    statsHtml += `<div class="stat-chip"><div class="num" style="color:${s.color}">${counts[s.id]}</div><div class="lbl">${s.label}</div></div>`;
  });
  statsHtml += `</div>`;

  let followupHtml = "";
  if (needsFollowup.length > 0) {
    followupHtml = `<div class="followup-banner">⏰ <b>${needsFollowup.length} candidatura${needsFollowup.length === 1 ? "" : "s"}</b> sin noticias desde hace ${FOLLOWUP_DAYS}+ días: ${needsFollowup.map(a => a.company).join(", ")}. Puede ser buen momento para escribir un seguimiento.</div>`;
  }

  let filterHtml = `<div class="filter-row">`;
  const filters = [{ id: "todas", label: "Todas" }, ...STATUSES];
  filters.forEach(f => {
    filterHtml += `<button class="filter-chip ${activeFilter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>`;
  });
  filterHtml += `</div>`;

  const filtered = activeFilter === "todas" ? apps : apps.filter(a => a.status === activeFilter);
  const sorted = filtered.slice().sort((a, b) => (b.dateApplied || "").localeCompare(a.dateApplied || ""));

  let listHtml = "";
  if (sorted.length === 0) {
    listHtml = `<div class="empty-state">${apps.length === 0 ? "Aún no has añadido ninguna candidatura.<br>Toca el botón + para empezar." : "No hay candidaturas con este filtro."}</div>`;
  } else {
    sorted.forEach(a => {
      const s = statusInfo(a.status);
      const d = daysSince(a.dateApplied);
      const warn = (a.status === "enviado" || a.status === "entrevista") && daysSince(a.lastUpdate || a.dateApplied) >= FOLLOWUP_DAYS;
      listHtml += `
        <div class="app-card ${warn ? 'warn' : ''}" data-id="${a.id}">
          <div class="app-card-top">
            <div>
              <div class="app-company">${escapeHtml(a.company)}</div>
              <div class="app-role">${escapeHtml(a.role || "")}</div>
            </div>
            <span class="status-badge" style="background:${s.color}22; color:${s.color};">${s.label}</span>
          </div>
          <div class="app-meta">
            <span class="app-days ${warn ? 'warn' : ''}">${warn ? "⏰ " : ""}Enviada hace ${d} día${d === 1 ? "" : "s"}</span>
            ${a.language ? `<span class="app-days">${a.language}</span>` : ""}
          </div>
        </div>
      `;
    });
  }

  app.innerHTML = statsHtml + followupHtml + filterHtml + listHtml;

  app.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => { activeFilter = btn.dataset.filter; render(); });
  });
  app.querySelectorAll('.app-card').forEach(card => {
    card.addEventListener('click', () => { editingId = card.dataset.id; currentView = "form"; render(); });
  });
}

function renderForm(app) {
  const apps = loadApps();
  const existing = editingId ? apps.find(a => a.id === editingId) : null;
  const data = existing || { company: "", role: "", dateApplied: todayStr(), status: "enviado", link: "", notes: "", language: "Español" };

  app.innerHTML = `
    <div class="field">
      <label>Empresa</label>
      <input type="text" id="fCompany" value="${escapeAttr(data.company)}" placeholder="Nombre de la empresa">
    </div>
    <div class="field">
      <label>Puesto</label>
      <input type="text" id="fRole" value="${escapeAttr(data.role)}" placeholder="Ej. Técnico GIS">
    </div>
    <div class="field">
      <label>Fecha de envío</label>
      <input type="date" id="fDate" value="${data.dateApplied}">
    </div>
    <div class="field">
      <label>Estado</label>
      <div class="status-select-row" id="statusRow">
        ${STATUSES.map(s => `<div class="status-opt ${data.status === s.id ? 'selected' : ''}" data-status="${s.id}" style="color:${s.color}">${s.label}</div>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Idioma del CV / carta</label>
      <select id="fLang">
        ${LANGS.map(l => `<option value="${l}" ${data.language === l ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Enlace a la oferta (opcional)</label>
      <input type="url" id="fLink" value="${escapeAttr(data.link)}" placeholder="https://...">
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="fNotes" placeholder="Contacto, salario, impresiones de la entrevista...">${escapeHtml(data.notes)}</textarea>
    </div>
    <button class="primary-btn" id="saveBtn">Guardar</button>
    ${existing ? `<button class="danger-btn" id="deleteBtn">Eliminar candidatura</button>` : ""}
  `;

  let selectedStatus = data.status;
  document.querySelectorAll('.status-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      selectedStatus = opt.dataset.status;
      document.querySelectorAll('.status-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const company = document.getElementById('fCompany').value.trim();
    if (!company) { showToast("⚠️ Falta el nombre de la empresa"); return; }
    const record = {
      id: existing ? existing.id : uid(),
      company,
      role: document.getElementById('fRole').value.trim(),
      dateApplied: document.getElementById('fDate').value || todayStr(),
      status: selectedStatus,
      language: document.getElementById('fLang').value,
      link: document.getElementById('fLink').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      lastUpdate: existing && existing.status === selectedStatus ? (existing.lastUpdate || existing.dateApplied) : todayStr()
    };
    const list = loadApps();
    const idx = list.findIndex(a => a.id === record.id);
    if (idx >= 0) list[idx] = record; else list.push(record);
    saveApps(list);
    showToast(existing ? "✅ Candidatura actualizada" : "✅ Candidatura añadida");
    currentView = "list"; editingId = null;
    render();
  });

  if (existing) {
    document.getElementById('deleteBtn').addEventListener('click', () => {
      if (!confirm("¿Eliminar esta candidatura? No se puede deshacer.")) return;
      const list = loadApps().filter(a => a.id !== existing.id);
      saveApps(list);
      showToast("🗑️ Candidatura eliminada");
      currentView = "list"; editingId = null;
      render();
    });
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || "";
  return div.innerHTML;
}
function escapeAttr(str) { return (str || "").replace(/"/g, "&quot;"); }

/* Init */
try {
  render();
} catch (e) {
  console.error("Error al iniciar la app:", e);
  document.getElementById('app').innerHTML = `
    <div class="info-box">
      <p>⚠️ Hubo un problema al cargar tus datos guardados.</p>
      <p>Puedes intentar recargar, o si persiste, reiniciar solo los datos de la app (tus datos guardados en este dispositivo se borrarían).</p>
    </div>
    <button class="secondary-btn" onclick="location.reload()">Recargar</button>
    <button class="danger-btn" onclick="localStorage.clear(); location.reload();">Reiniciar datos de la app</button>
  `;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
